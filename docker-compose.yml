services:
  remindre-bot:
    build: .
    container_name: remindre-bot
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./config:/app/config
      - ./credentials:/app/credentials
      - ./templates:/app/templates
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./src:/app/src
      - ./scripts:/app/scripts
    command: python -m src.main
    restart: unless-stopped
    # Port 8081: HTTP /health endpoint untuk Uptime Kuma (internal only — di-share via homelab-backend).
    # Tidak di-publish ke host, hanya reachable dari container lain di network yang sama.
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 20s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Web Admin GUI: CRUD user, monitoring, edit/hapus log, re-generate laporan.
  # Share MySQL + storage (image di-mount) dengan remindre-bot.
  remindre-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: remindre-web
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./config:/app/config
      - ./credentials:/app/credentials
      - ./templates:/app/templates
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./src:/app/src
    # Hanya listen di dalam container (aman di belakang Nginx reverse-proxy).
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - backend
    depends_on:
      - remindre-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    external: true
    name: homelab-backend
